# Conda environment for the SignalShap reproducibility release.
#
#   conda env create -f environment.yml
#   conda activate signalshap
#
# The floors match requirements.txt. They are LOWER BOUNDS, not pins, because
# the results do not depend on an exact patch release: the pipeline is
# deterministic given a fixed BLAS, and the empty-coalition baseline is
# hash-derived rather than drawn from a NumPy Generator precisely so it
# survives version changes.
#
# WHAT DOES DEPEND ON THE ENVIRONMENT, and is disclosed rather than pinned
# away: ALS and truncated SVD accumulate in an order set by the BLAS, so
# arm64 (Accelerate) and x86-64 (OpenBLAS/MKL) disagree on candidate CONTENTS
# for 2 of 6,035 MovieLens users. That moves v(G) by about 5.4e-4 and the raw
# monotonicity count between 16 and 26, while every reported sign, ordering
# and material count is unchanged. Never compare a fifth decimal across
# platforms; see artefacts/PROVENANCE.md.
#
# Reference environment that produced the released artefacts:
#   python 3.11.2, numpy 2.4.6, scipy 1.17.1, pandas 3.0.5,
#   scikit-learn 1.9.0, matplotlib 3.11.1
# recorded per artefact in artefacts/MANIFEST.json.
#
# CPU only. No GPU, no CUDA, no PyTorch: five sources give 2^5 = 32
# coalitions, so the Shapley value is enumerated exactly on a laptop.
name: signalshap
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pyarrow>=12.0
  - tabulate>=0.9
  - jinja2>=3.1
  # Test suite and notebook execution.
  - pytest>=7.4
  - nbformat>=5.9
  - nbclient>=0.8
  - pip
