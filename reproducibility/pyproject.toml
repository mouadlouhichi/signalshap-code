[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalshap"
version = "1.0.0"
description = "Exact Shapley credit assignment over collaborative, content, and contextual signals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Mouad Louhichi", email = "mouad_louhichi@um5.ac.ma"},
  {name = "Redwane Nesmaoui"},
  {name = "Mohamed Lazaar"},
]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "matplotlib>=3.7", "pyyaml>=6.0", "pyarrow>=12.0",
  "tabulate>=0.9", "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.8", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
